<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Skyline Tribute</title>

  <!-- Tailwind CSS (CDN). Para producción conviene compilar Tailwind localmente. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Press Start 2P"', '"Pixelify Sans"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen text-slate-100 font-sans">

  <main class="min-h-screen flex flex-col items-center justify-center gap-6 px-4 py-8">

    <!-- Encabezado: íconos fuera del canvas para no interceptar el vuelo -->
    <header class="game-header">
      <button id="btn-user" type="button" class="hud-icon-btn" aria-label="Nombre de jugador" title="Nombre">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.25" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M5.5 19.2c.8-3.4 3.3-5.2 6.5-5.2s5.7 1.8 6.5 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="game-header-copy">
        <h1 class="text-xl sm:text-2xl leading-relaxed">Skyline Tribute</h1>
        <p class="mt-2 text-[10px] sm:text-xs text-slate-400 leading-relaxed">Espacio, flecha arriba o toca para volar</p>
      </div>
      <button id="btn-stats" type="button" class="hud-icon-btn" aria-label="Clasificación global" title="Top 10">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 19V11M12 19V7M16 19v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- Contenedor del juego: el canvas se escala dentro de este marco -->
    <div id="game-shell" class="game-shell">

      <!-- Marcador (HUD) superpuesto al canvas -->
      <div class="scoreboard">
        <div class="score-card">
          <span class="score-label">Puntos</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="score-card">
          <span class="score-label">Récord</span>
          <span id="best" class="score-value">0</span>
        </div>
      </div>

      <!-- Lienzo del juego. La resolución interna la fija game.js. -->
      <canvas id="game" class="game-canvas" width="480" height="640" aria-label="Área de juego"></canvas>

      <!-- Filtro CRT: scanlines + viñeta. No captura clics. -->
      <div class="crt-overlay" aria-hidden="true"></div>

      <!-- Capas de interfaz: se muestran/ocultan desde game.js -->
      <div id="overlay-start" class="overlay">
        <div class="overlay-panel">
          <h2 class="text-lg sm:text-xl leading-relaxed">¿Listo?</h2>
          <p class="mt-3 text-[10px] sm:text-xs text-slate-300 leading-relaxed">
            Pulsa <kbd class="kbd">Espacio</kbd> o toca la pantalla para empezar.
          </p>
        </div>
      </div>

      <div id="overlay-over" class="overlay hidden">
        <div class="overlay-panel">
          <h2 class="text-lg sm:text-xl leading-relaxed text-rose-400">Game Over</h2>
          <p class="mt-3 text-[10px] sm:text-xs text-slate-300 leading-relaxed">
            Puntuación: <span id="final-score" class="text-slate-100">0</span>
          </p>
          <p id="new-record" class="mt-2 text-[10px] sm:text-xs text-amber-300 hidden">¡Nuevo récord!</p>
          <p class="mt-4 text-[10px] sm:text-xs text-slate-300 leading-relaxed">
            Pulsa cualquier tecla o toca para reiniciar.
          </p>
        </div>
      </div>

    </div>

    <!-- Controles accesibles (también útiles en móvil) -->
    <footer class="flex flex-wrap items-center justify-center gap-3">
      <button id="btn-restart" type="button"
              class="rounded-lg bg-sky-500 px-4 py-2 text-[10px] sm:text-xs text-slate-900 transition hover:bg-sky-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-300">
        Reiniciar
      </button>
      <button id="btn-pause" type="button"
              class="rounded-lg border border-slate-700 bg-slate-800 px-4 py-2 text-[10px] sm:text-xs text-slate-200 transition hover:bg-slate-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-500">
        Pausa
      </button>
    </footer>

  </main>

  <!-- Modales HUD: encima de la página, no del lienzo de juego -->
  <div id="modal-user" class="hud-modal hidden" role="dialog" aria-labelledby="modal-user-title" aria-modal="true">
    <div class="hud-modal-backdrop" data-close-modal></div>
    <div class="hud-modal-panel">
      <button type="button" class="hud-modal-close" data-close-modal aria-label="Cerrar">×</button>
      <h2 id="modal-user-title" class="hud-modal-title">Tu nombre</h2>
      <p class="hud-modal-copy">Se usará en la clasificación global.</p>
      <form id="form-user" class="hud-user-form">
        <input id="input-username" name="username" type="text" maxlength="16" autocomplete="nickname" placeholder="Jugador" />
        <button type="submit" class="hud-modal-submit">Guardar</button>
      </form>
      <p id="user-save-status" class="hud-modal-status" aria-live="polite"></p>
    </div>
  </div>

  <div id="modal-stats" class="hud-modal hidden" role="dialog" aria-labelledby="modal-stats-title" aria-modal="true">
    <div class="hud-modal-backdrop" data-close-modal></div>
    <div class="hud-modal-panel hud-modal-panel-wide">
      <button type="button" class="hud-modal-close" data-close-modal aria-label="Cerrar">×</button>
      <h2 id="modal-stats-title" class="hud-modal-title">Top 10</h2>
      <div id="leaderboard-list" class="leaderboard-list">
        <p class="leaderboard-empty">Cargando...</p>
      </div>
    </div>
  </div>

  <script src="leaderboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
